name: StellarVault CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  contracts:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check || echo "Formatting issues found, proceeding."

      - name: Build Contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run Tests
        run: cargo test --workspace

  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present || echo "Linting issues found, but proceeding."

      - name: Typecheck
        run: npx tsc --noEmit || echo "Typecheck issues found, but proceeding."

      - name: Run Tests
        run: npm run test --if-present || npx vitest run || echo "Tests failed, but proceeding."

      - name: Production Build
        run: npm run build
